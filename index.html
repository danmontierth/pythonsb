<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Solar System 3D</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: #000; overflow: hidden; overscroll-behavior: none;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    touch-action: none; user-select: none;
  }
  #app { position: fixed; inset: 0; }
  canvas { display: block; touch-action: none; }

  #loading {
    position: fixed; inset: 0; background: #000; color: #cfd8ff;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    z-index: 50; gap: 14px; transition: opacity .6s ease;
  }
  #loading .spinner {
    width: 42px; height: 42px; border-radius: 50%;
    border: 3px solid rgba(140,160,255,0.25); border-top-color: #8cf;
    animation: spin 0.9s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  #loading span { font-size: 13px; letter-spacing: .08em; opacity: .7; text-transform: uppercase; }

  .hud {
    position: fixed; z-index: 10; color: #e9edff;
    font-size: 13px; pointer-events: none;
  }
  #title {
    top: max(10px, env(safe-area-inset-top)); left: 12px;
    pointer-events: none;
  }
  #title b { font-size: 15px; letter-spacing: .02em; }
  #title div { opacity: .55; font-size: 11px; margin-top: 2px; }

  #hint {
    top: max(10px, env(safe-area-inset-top)); right: 12px; text-align: right;
    max-width: 46vw; opacity: .55; font-size: 11px; line-height: 1.4;
    transition: opacity .8s ease;
  }

  .glass {
    background: rgba(18,20,32,0.62);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,0.08);
  }

  #controls {
    position: fixed; left: 0; right: 0;
    bottom: max(8px, env(safe-area-inset-bottom));
    z-index: 12; display: flex; flex-direction: column; gap: 8px;
    align-items: center; pointer-events: none;
  }
  #controls > * { pointer-events: auto; }

  #planetBar {
    display: flex; gap: 6px; overflow-x: auto; max-width: 96vw;
    padding: 6px 8px; border-radius: 16px; -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
  }
  #planetBar::-webkit-scrollbar { display: none; }
  .pbtn {
    flex: 0 0 auto; display: flex; flex-direction: column; align-items: center;
    gap: 3px; width: 52px; padding: 4px 0 2px; border-radius: 10px; cursor: pointer;
    color: #dfe4ff; font-size: 9px; letter-spacing: .02em; border: none; background: transparent;
  }
  .pbtn.active { background: rgba(140,170,255,0.18); }
  .pbtn .dot { width: 20px; height: 20px; border-radius: 50%; box-shadow: 0 0 8px 1px currentColor inset, 0 0 6px 0 currentColor; }

  #toolbar {
    display: flex; gap: 8px; align-items: center; padding: 8px 10px;
    border-radius: 16px;
  }
  #toolbar button {
    border: none; background: rgba(255,255,255,0.08); color: #eef;
    width: 38px; height: 38px; border-radius: 10px; font-size: 16px;
    display: flex; align-items: center; justify-content: center; cursor: pointer;
  }
  #toolbar button.on { background: linear-gradient(135deg,#5b7fff,#8b5bff); }
  #speedWrap { display: flex; align-items: center; gap: 6px; color: #cfe; font-size: 11px; padding: 0 4px; }
  #speed { width: 90px; accent-color: #8b9dff; }

  #infoPanel {
    position: fixed; left: 0; right: 0; bottom: calc(var(--controls-h, 112px) + 6px); z-index: 15;
    border-radius: 18px; padding: 16px 18px;
    transform: translateY(70vh); transition: transform .35s cubic-bezier(.2,.9,.25,1);
    color: #eef1ff; max-height: 34vh; overflow-y: auto;
    margin: 0 8px;
  }
  #infoPanel.open { transform: translateY(0); }
  #infoPanel .close {
    position: absolute; top: 10px; right: 14px; background: none; border: none;
    color: #aab; font-size: 20px; cursor: pointer; padding: 4px 8px;
  }
  #infoPanel h2 { margin: 0 0 4px; font-size: 20px; }
  #infoPanel .tag { font-size: 11px; opacity: .55; margin-bottom: 10px; text-transform: uppercase; letter-spacing: .08em;}
  #infoPanel .fact { display: flex; justify-content: space-between; font-size: 13px; padding: 6px 0; border-bottom: 1px solid rgba(255,255,255,0.06); }
  #infoPanel .fact span:first-child { opacity: .55; }
  #infoPanel p.blurb { font-size: 12.5px; opacity: .8; line-height: 1.5; margin: 10px 0 0; }

  #gyroModal {
    position: fixed; inset: 0; z-index: 40; display: none;
    align-items: center; justify-content: center; background: rgba(0,0,0,0.55);
  }
  #gyroModal .box {
    max-width: 320px; padding: 22px; border-radius: 16px; text-align: center; color: #eef;
  }
  #gyroModal button {
    margin-top: 14px; background: linear-gradient(135deg,#5b7fff,#8b5bff); border: none;
    color: #fff; padding: 10px 20px; border-radius: 10px; font-size: 14px;
  }

  .label {
    position: absolute; top: 0; left: 0; color: #dfe6ff; font-size: 11px;
    text-shadow: 0 0 4px #000, 0 0 8px #000; pointer-events: none;
    transform: translate(-50%, -140%); white-space: nowrap; z-index: 5;
    letter-spacing: .03em;
  }
</style>
</head>
<body>
<div id="app"></div>

<div id="loading">
  <div class="spinner"></div>
  <span>Building the solar system…</span>
</div>

<div class="hud glass" id="title" style="padding:8px 12px; border-radius:12px;">
  <b>🪐 Solar System</b>
  <div>Drag / swipe to look around</div>
</div>

<div class="hud glass" id="hint" style="padding:8px 12px; border-radius:12px;">
  Pinch to zoom · Tap a planet to explore
</div>

<div id="labelLayer"></div>

<div id="infoPanel" class="glass">
  <button class="close" id="infoClose">✕</button>
  <div class="tag" id="infoTag">Planet</div>
  <h2 id="infoName">Earth</h2>
  <div id="infoFacts"></div>
  <p class="blurb" id="infoBlurb"></p>
</div>

<div id="controls">
  <div id="planetBar" class="glass"></div>
  <div id="toolbar" class="glass">
    <button id="btnPlay" title="Play/Pause">⏸</button>
    <div id="speedWrap">
      <span>🐢</span><input id="speed" type="range" min="0" max="60" value="8" step="1"><span>🐇</span>
    </div>
    <button id="btnLabels" title="Toggle labels">🏷️</button>
    <button id="btnGyro" title="Gyroscope look">🧭</button>
    <button id="btnReset" title="Reset view">🏠</button>
  </div>
</div>

<div id="gyroModal">
  <div class="box glass">
    <div style="font-size:28px;">🧭</div>
    <h3 style="margin:8px 0 4px;">Motion Look-Around</h3>
    <p style="font-size:13px; opacity:.75; line-height:1.5;">Move your phone to look around the solar system. Your browser needs permission to use motion sensors.</p>
    <button id="gyroAllow">Enable Motion</button>
    <div style="margin-top:8px;"><button id="gyroCancel" style="background:rgba(255,255,255,0.1);">Not now</button></div>
  </div>
</div>

<script src="https://unpkg.com/three@0.128.0/build/three.min.js"></script>
<script src="https://unpkg.com/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://unpkg.com/three@0.128.0/examples/js/controls/DeviceOrientationControls.js"></script>
<script>
(function(){
"use strict";

/* ---------------------------------------------------------------------
   PROCEDURAL TEXTURE GENERATORS (no external image assets required)
--------------------------------------------------------------------- */
function newCanvas(w,h){ const c=document.createElement('canvas'); c.width=w; c.height=h; return c; }
function rnd(a,b){ return a + Math.random()*(b-a); }
function lerpColor(c1,c2,t){
  return [ c1[0]+(c2[0]-c1[0])*t, c1[1]+(c2[1]-c1[1])*t, c1[2]+(c2[2]-c1[2])*t ];
}
function hexToRgb(hex){
  if(typeof hex === 'string'){ hex = parseInt(hex.replace('#',''), 16); }
  return [ (hex>>16)&255, (hex>>8)&255, hex&255 ];
}
function rgbStr(c,a){ return `rgba(${c[0]|0},${c[1]|0},${c[2]|0},${a===undefined?1:a})`; }

function makeRockyTexture(baseHex, darkHex, lightHex, craterCount){
  const c = newCanvas(512,256), ctx = c.getContext('2d');
  const base = hexToRgb(baseHex);
  ctx.fillStyle = rgbStr(base); ctx.fillRect(0,0,512,256);
  // mottling
  for(let i=0;i<2200;i++){
    const t = Math.random();
    const col = lerpColor(hexToRgb(darkHex), hexToRgb(lightHex), t);
    ctx.fillStyle = rgbStr(col, 0.06);
    const r = rnd(2,10);
    ctx.beginPath(); ctx.arc(rnd(0,512), rnd(0,256), r, 0, Math.PI*2); ctx.fill();
  }
  // craters
  for(let i=0;i<craterCount;i++){
    const x=rnd(0,512), y=rnd(0,256), r=rnd(2,16);
    const g = ctx.createRadialGradient(x-r*0.3,y-r*0.3,r*0.1, x,y,r);
    g.addColorStop(0, rgbStr(hexToRgb(lightHex),0.35));
    g.addColorStop(0.5, rgbStr(hexToRgb(darkHex),0.35));
    g.addColorStop(1, rgbStr(base,0));
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.fill();
  }
  return new THREE.CanvasTexture(c);
}

function makeGasTexture(bandColors, spot){
  const c = newCanvas(512,256), ctx = c.getContext('2d');
  const bands = 22;
  for(let i=0;i<bands;i++){
    const y0 = (i/bands)*256, h = 256/bands;
    const col = bandColors[Math.floor(Math.random()*bandColors.length)];
    const col2 = bandColors[Math.floor(Math.random()*bandColors.length)];
    const grad = ctx.createLinearGradient(0,y0,0,y0+h);
    grad.addColorStop(0, rgbStr(hexToRgb(col)));
    grad.addColorStop(1, rgbStr(hexToRgb(col2)));
    ctx.fillStyle = grad;
    ctx.fillRect(0,y0,512,h+1);
  }
  // turbulent swirl overlay
  ctx.globalAlpha = 0.18;
  for(let i=0;i<900;i++){
    const y = rnd(0,256);
    const col = bandColors[Math.floor(Math.random()*bandColors.length)];
    ctx.strokeStyle = rgbStr(hexToRgb(col));
    ctx.lineWidth = rnd(0.5,2);
    ctx.beginPath();
    const x0 = rnd(0,512);
    ctx.moveTo(x0,y);
    ctx.bezierCurveTo(x0+rnd(-40,40), y+rnd(-6,6), x0+rnd(20,80), y+rnd(-6,6), x0+rnd(60,140), y);
    ctx.stroke();
  }
  ctx.globalAlpha = 1;
  if(spot){
    const x = 340, y = 165, rx=46, ry=26;
    const g = ctx.createRadialGradient(x,y,4,x,y,rx);
    g.addColorStop(0, rgbStr(hexToRgb(spot)));
    g.addColorStop(1, rgbStr(hexToRgb(spot),0));
    ctx.fillStyle = g;
    ctx.save(); ctx.translate(x,y); ctx.scale(1,ry/rx); ctx.translate(-x,-y);
    ctx.beginPath(); ctx.arc(x,y,rx,0,Math.PI*2); ctx.fill(); ctx.restore();
  }
  return new THREE.CanvasTexture(c);
}

function makeEarthTexture(){
  const c = newCanvas(512,256), ctx = c.getContext('2d');
  ctx.fillStyle = '#144a86'; ctx.fillRect(0,0,512,256);
  // shallow water tint near coasts done via continents blur
  const landColors = ['#3f7d3a','#5c8f42','#7a9a4a','#8a7440'];
  for(let cont=0; cont<9; cont++){
    const cx = rnd(0,512), cy = rnd(30,226);
    ctx.fillStyle = landColors[cont%landColors.length];
    ctx.beginPath();
    const pts = 10 + (Math.random()*6|0);
    const baseR = rnd(22,60);
    for(let i=0;i<=pts;i++){
      const ang = (i/pts)*Math.PI*2;
      const r = baseR * rnd(0.55,1.15);
      const x = cx + Math.cos(ang)*r, y = cy + Math.sin(ang)*r*0.7;
      if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
    }
    ctx.closePath(); ctx.fill();
  }
  // ice caps
  ctx.fillStyle = 'rgba(255,255,255,0.9)';
  ctx.fillRect(0,0,512,14);
  ctx.fillRect(0,242,512,14);
  return new THREE.CanvasTexture(c);
}

function makeCloudsTexture(coverage){
  const c = newCanvas(512,256), ctx = c.getContext('2d');
  ctx.clearRect(0,0,512,256);
  for(let i=0;i<coverage;i++){
    const x = rnd(0,512), y = rnd(0,256), r = rnd(8,30);
    const g = ctx.createRadialGradient(x,y,0,x,y,r);
    g.addColorStop(0, 'rgba(255,255,255,0.85)');
    g.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.fill();
  }
  return new THREE.CanvasTexture(c);
}

function makeSunTexture(){
  const c = newCanvas(512,256), ctx = c.getContext('2d');
  const grad = ctx.createLinearGradient(0,0,0,256);
  grad.addColorStop(0,'#fff6c8'); grad.addColorStop(0.5,'#ffd35c'); grad.addColorStop(1,'#ff9d2e');
  ctx.fillStyle = grad; ctx.fillRect(0,0,512,256);
  for(let i=0;i<3000;i++){
    const x=rnd(0,512), y=rnd(0,256), r=rnd(1,4);
    ctx.fillStyle = Math.random()>0.5 ? 'rgba(255,255,255,0.12)' : 'rgba(180,60,0,0.12)';
    ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.fill();
  }
  return new THREE.CanvasTexture(c);
}

function makeGlowSprite(colorInner, colorOuter, size){
  const c = newCanvas(size,size), ctx = c.getContext('2d');
  const g = ctx.createRadialGradient(size/2,size/2,0,size/2,size/2,size/2);
  g.addColorStop(0, colorInner); g.addColorStop(0.4, colorOuter); g.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle = g; ctx.fillRect(0,0,size,size);
  return new THREE.CanvasTexture(c);
}

function makeStarSprite(){
  const c = newCanvas(32,32), ctx = c.getContext('2d');
  const g = ctx.createRadialGradient(16,16,0,16,16,16);
  g.addColorStop(0,'rgba(255,255,255,1)'); g.addColorStop(0.35,'rgba(255,255,255,0.7)'); g.addColorStop(1,'rgba(255,255,255,0)');
  ctx.fillStyle = g; ctx.fillRect(0,0,32,32);
  return new THREE.CanvasTexture(c);
}

function makeRingTexture(bands){
  const c = newCanvas(256,8), ctx = c.getContext('2d');
  for(let x=0;x<256;x++){
    const t = x/256;
    let a = 0.15 + 0.5*Math.abs(Math.sin(t*Math.PI*bands));
    if(t<0.06 || t>0.97) a = 0;
    ctx.fillStyle = `rgba(210,190,160,${a.toFixed(3)})`;
    ctx.fillRect(x,0,1,8);
  }
  return new THREE.CanvasTexture(c);
}

function fixRingUVs(geometry, innerR, outerR){
  const pos = geometry.attributes.position;
  const v3 = new THREE.Vector3();
  const uvs = [];
  for(let i=0;i<pos.count;i++){
    v3.fromBufferAttribute(pos,i);
    const r = v3.length();
    uvs.push((r-innerR)/(outerR-innerR), 1);
  }
  geometry.setAttribute('uv', new THREE.Float32BufferAttribute(uvs,2));
}

/* ---------------------------------------------------------------------
   SCENE / RENDERER / CAMERA
--------------------------------------------------------------------- */
const app = document.getElementById('app');
const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(55, window.innerWidth/window.innerHeight, 0.1, 8000);
const DEFAULT_CAM_POS = new THREE.Vector3(0, 95, 230);
camera.position.copy(DEFAULT_CAM_POS);

const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.outputEncoding = THREE.sRGBEncoding;
app.appendChild(renderer.domElement);

const orbitControls = new THREE.OrbitControls(camera, renderer.domElement);
orbitControls.enableDamping = true;
orbitControls.dampingFactor = 0.08;
orbitControls.minDistance = 4;
orbitControls.maxDistance = 900;
orbitControls.target.set(0,0,0);

let deviceControls = null;
let gyroActive = false;

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  syncControlsHeight();
});

const controlsEl = document.getElementById('controls');
function syncControlsHeight(){
  document.documentElement.style.setProperty('--controls-h', controlsEl.offsetHeight + 'px');
}
syncControlsHeight();
setTimeout(syncControlsHeight, 300);

/* ---------------------------------------------------------------------
   LIGHTS + STARFIELD
--------------------------------------------------------------------- */
scene.add(new THREE.AmbientLight(0x8fa0d0, 0.6));
const sunLight = new THREE.PointLight(0xfff2d0, 1.35, 0, 0);
scene.add(sunLight);

(function starfield(){
  const starTex = makeStarSprite();
  const geo = new THREE.BufferGeometry();
  const N = 6000;
  const positions = new Float32Array(N*3);
  const sizes = new Float32Array(N);
  for(let i=0;i<N;i++){
    const r = rnd(600, 3200);
    const theta = Math.acos(rnd(-1,1));
    const phi = rnd(0, Math.PI*2);
    positions[i*3]   = r*Math.sin(theta)*Math.cos(phi);
    positions[i*3+1] = r*Math.cos(theta);
    positions[i*3+2] = r*Math.sin(theta)*Math.sin(phi);
    sizes[i] = rnd(0.6, 2.4);
  }
  geo.setAttribute('position', new THREE.BufferAttribute(positions,3));
  const mat = new THREE.PointsMaterial({ map:starTex, size:2.2, transparent:true, depthWrite:false, opacity:0.9, sizeAttenuation:true });
  scene.add(new THREE.Points(geo, mat));
})();

/* ---------------------------------------------------------------------
   SUN
--------------------------------------------------------------------- */
const sunGroup = new THREE.Group();
scene.add(sunGroup);
const sunTex = makeSunTexture();
const sunMesh = new THREE.Mesh(
  new THREE.SphereGeometry(10, 48, 32),
  new THREE.MeshBasicMaterial({ map: sunTex })
);
sunGroup.add(sunMesh);
const sunGlow = new THREE.Sprite(new THREE.SpriteMaterial({
  map: makeGlowSprite('rgba(255,244,200,0.9)','rgba(255,170,60,0.55)',256),
  transparent:true, depthWrite:false, blending: THREE.AdditiveBlending
}));
sunGlow.scale.set(60,60,1);
sunGroup.add(sunGlow);

/* ---------------------------------------------------------------------
   PLANET DATA
--------------------------------------------------------------------- */
const PLANETS = [
  { key:'mercury', name:'Mercury', color:0x9c9c9c, radius:1.3, distance:26, orbitalPeriod:88, rotationPeriod:58.6, tilt:0.03, type:'rocky',
    texArgs:[0x9c9c9c,0x5c5c5c,0xd6d6d6,140], facts:{ 'Diameter':'4,879 km', 'Distance from Sun':'57.9 million km', 'Orbital period':'88 days', 'Day length':'59 Earth days', 'Moons':'0' },
    blurb:'The smallest and fastest planet, Mercury is a scorched, cratered world with almost no atmosphere.' },
  { key:'venus', name:'Venus', color:0xe8c98a, radius:2.1, distance:38, orbitalPeriod:224.7, rotationPeriod:-243, tilt:177.4, type:'gas',
    texArgs:[[ '#e9d3a0','#d8b978','#f2e2b8','#c9a866' ], null], facts:{ 'Diameter':'12,104 km', 'Distance from Sun':'108.2 million km', 'Orbital period':'224.7 days', 'Day length':'243 Earth days (retrograde)', 'Moons':'0' },
    blurb:'Venus spins backwards and is smothered in thick, toxic clouds that trap heat — hotter than Mercury.' },
  { key:'earth', name:'Earth', color:0x2f6fb0, radius:2.2, distance:52, orbitalPeriod:365.25, rotationPeriod:1, tilt:23.4, type:'earth',
    facts:{ 'Diameter':'12,742 km', 'Distance from Sun':'149.6 million km', 'Orbital period':'365.25 days', 'Day length':'24 hours', 'Moons':'1 (the Moon)' },
    blurb:'Our home — the only known world with liquid water oceans and life.',
    moons:[ { name:'Moon', radius:0.6, distance:5.5, orbitalPeriod:27.3, color:0xaaaaaa } ] },
  { key:'mars', name:'Mars', color:0xb3542f, radius:1.6, distance:68, orbitalPeriod:687, rotationPeriod:1.03, tilt:25.2, type:'rocky',
    texArgs:[0xb3542f,0x7a3010,0xd98a55,120], facts:{ 'Diameter':'6,779 km', 'Distance from Sun':'227.9 million km', 'Orbital period':'687 days', 'Day length':'24.6 hours', 'Moons':'2 (Phobos, Deimos)' },
    blurb:'The Red Planet gets its color from iron oxide (rust) dust covering its surface.' },
  { key:'jupiter', name:'Jupiter', color:0xd8ca9d, radius:8.4, distance:118, orbitalPeriod:4331, rotationPeriod:0.41, tilt:3.1, type:'gas',
    texArgs:[[ '#e3d2ab','#c9a877','#efe2c0','#b98f61','#d9c193' ], '#c2603a'], facts:{ 'Diameter':'139,820 km', 'Distance from Sun':'778.5 million km', 'Orbital period':'11.9 years', 'Day length':'9.9 hours', 'Moons':'95 known' },
    blurb:'The largest planet — a gas giant with a Great Red Spot storm bigger than Earth.',
    moons:[ { name:'Io', radius:0.5, distance:11, orbitalPeriod:1.8, color:0xd7c85a }, { name:'Europa', radius:0.45, distance:13, orbitalPeriod:3.6, color:0xcac2a8 }, { name:'Ganymede', radius:0.7, distance:16, orbitalPeriod:7.2, color:0x998f7d }, { name:'Callisto', radius:0.65, distance:19, orbitalPeriod:16.7, color:0x7a7263 } ] },
  { key:'saturn', name:'Saturn', color:0xead6a8, radius:7.2, distance:170, orbitalPeriod:10747, rotationPeriod:0.45, tilt:26.7, type:'gas', rings:{ inner:9.5, outer:17, bands:24 },
    texArgs:[[ '#f1e3bd','#e0cd98','#f6ecd0','#d3bb84' ], null], facts:{ 'Diameter':'116,460 km', 'Distance from Sun':'1.43 billion km', 'Orbital period':'29.5 years', 'Day length':'10.7 hours', 'Moons':'146 known' },
    blurb:'Famous for its dazzling ring system made of countless ice and rock particles.' },
  { key:'uranus', name:'Uranus', color:0xaee3e6, radius:4.8, distance:215, orbitalPeriod:30589, rotationPeriod:-0.72, tilt:97.8, type:'gas', rings:{ inner:6.5, outer:9, bands:10 },
    texArgs:[[ '#b7e6e8','#9fd6d9','#cdf0f1' ], null], facts:{ 'Diameter':'50,724 km', 'Distance from Sun':'2.87 billion km', 'Orbital period':'84 years', 'Day length':'17.2 hours (retrograde)', 'Moons':'28 known' },
    blurb:'Uranus rotates almost on its side, likely tipped over by an ancient collision.' },
  { key:'neptune', name:'Neptune', color:0x5b7bdb, radius:4.6, distance:255, orbitalPeriod:59800, rotationPeriod:0.67, tilt:28.3, type:'gas',
    texArgs:[[ '#4d6fd6','#3c58b8','#6c8ce6' ], '#dfe6ff'], facts:{ 'Diameter':'49,244 km', 'Distance from Sun':'4.5 billion km', 'Orbital period':'165 years', 'Day length':'16.1 hours', 'Moons':'16 known' },
    blurb:'The windiest planet, with storms racing at over 2,000 km/h in a deep blue atmosphere.' },
];

const SUN_FACTS = { 'Diameter':'1,391,000 km', 'Mass share':'99.86% of the solar system', 'Surface temp':'~5,500°C', 'Core temp':'~15,000,000°C', 'Age':'~4.6 billion years' };
const SUN_BLURB = 'A massive ball of hydrogen and helium plasma whose gravity holds the entire solar system together.';

/* ---------------------------------------------------------------------
   BUILD PLANETS
--------------------------------------------------------------------- */
const planetHolders = [];  // Object3D, world position tracks the planet
const planetMeshes = [];
const orbitPivots = [];

function buildPlanet(data){
  const pivot = new THREE.Object3D();
  scene.add(pivot);
  pivot.rotation.y = rnd(0, Math.PI*2);

  const holder = new THREE.Object3D();
  holder.position.set(data.distance, 0, 0);
  pivot.add(holder);

  let map;
  if(data.type === 'rocky') map = makeRockyTexture(...data.texArgs);
  else if(data.type === 'gas') map = makeGasTexture(...data.texArgs);
  else if(data.type === 'earth') map = makeEarthTexture();

  const mat = new THREE.MeshStandardMaterial({ map, roughness:0.9, metalness:0.02, color: 0xffffff });
  const mesh = new THREE.Mesh(new THREE.SphereGeometry(data.radius, 40, 28), mat);
  mesh.rotation.z = THREE.MathUtils.degToRad(data.tilt);
  holder.add(mesh);

  if(data.type === 'earth'){
    const cloudMat = new THREE.MeshStandardMaterial({ map: makeCloudsTexture(70), transparent:true, opacity:0.55, roughness:1, depthWrite:false });
    const clouds = new THREE.Mesh(new THREE.SphereGeometry(data.radius*1.015, 32, 24), cloudMat);
    mesh.add(clouds);
  }

  if(data.rings){
    const { inner, outer, bands } = data.rings;
    const ringGeo = new THREE.RingGeometry(inner, outer, 96, 4);
    fixRingUVs(ringGeo, inner, outer);
    const ringMat = new THREE.MeshBasicMaterial({ map: makeRingTexture(bands), side: THREE.DoubleSide, transparent:true, opacity:0.9 });
    const ring = new THREE.Mesh(ringGeo, ringMat);
    ring.rotation.x = Math.PI/2;
    mesh.add(ring);
  }

  if(data.moons){
    data.moons.forEach(m => {
      const mPivot = new THREE.Object3D();
      mPivot.rotation.y = rnd(0, Math.PI*2);
      holder.add(mPivot);
      const mMesh = new THREE.Mesh(
        new THREE.SphereGeometry(m.radius, 16, 12),
        new THREE.MeshStandardMaterial({ color: m.color, roughness:1 })
      );
      mMesh.position.set(m.distance, 0, 0);
      mPivot.add(mMesh);
      m._pivot = mPivot;
    });
  }

  // orbit path line
  const curvePts = [];
  for(let i=0;i<=128;i++){
    const a = (i/128)*Math.PI*2;
    curvePts.push(new THREE.Vector3(Math.cos(a)*data.distance, 0, Math.sin(a)*data.distance));
  }
  const orbitGeo = new THREE.BufferGeometry().setFromPoints(curvePts);
  const orbitMat = new THREE.LineBasicMaterial({ color: 0x6f7fb8, transparent:true, opacity:0.25 });
  scene.add(new THREE.LineLoop(orbitGeo, orbitMat));

  data._pivot = pivot;
  data._holder = holder;
  data._mesh = mesh;
  mesh.userData.planetKey = data.key;

  planetHolders.push(holder);
  planetMeshes.push(mesh);
  orbitPivots.push(pivot);
}

PLANETS.forEach(buildPlanet);

/* ---------------------------------------------------------------------
   ASTEROID BELT
--------------------------------------------------------------------- */
(function asteroidBelt(){
  const COUNT = 1100;
  const geo = new THREE.IcosahedronGeometry(0.28, 0);
  const mat = new THREE.MeshStandardMaterial({ color: 0x8c8378, roughness:1 });
  const mesh = new THREE.InstancedMesh(geo, mat, COUNT);
  const dummy = new THREE.Object3D();
  for(let i=0;i<COUNT;i++){
    const r = rnd(85, 104);
    const a = rnd(0, Math.PI*2);
    const y = rnd(-1.6, 1.6);
    dummy.position.set(Math.cos(a)*r, y, Math.sin(a)*r);
    dummy.rotation.set(rnd(0,7), rnd(0,7), rnd(0,7));
    const s = rnd(0.4, 1.6);
    dummy.scale.set(s,s,s);
    dummy.updateMatrix();
    mesh.setMatrixAt(i, dummy.matrix);
  }
  scene.add(mesh);
})();

/* ---------------------------------------------------------------------
   LABELS (screen-space projected)
--------------------------------------------------------------------- */
const labelLayer = document.getElementById('labelLayer');
let labelsOn = false;
const labelEls = {};
function makeLabel(key, text){
  const el = document.createElement('div');
  el.className = 'label'; el.textContent = text;
  el.style.display = 'none';
  labelLayer.appendChild(el);
  labelEls[key] = el;
}
makeLabel('sun', 'Sun');
PLANETS.forEach(p => makeLabel(p.key, p.name));

const _v = new THREE.Vector3();
function updateLabels(){
  if(!labelsOn) return;
  function place(el, obj3d, size){
    obj3d.getWorldPosition(_v);
    const behind = _v.clone().sub(camera.position).dot(camera.getWorldDirection(new THREE.Vector3())) < 0;
    _v.project(camera);
    if(behind || _v.z > 1){ el.style.display = 'none'; return; }
    el.style.display = 'block';
    el.style.left = ((_v.x*0.5+0.5)*window.innerWidth) + 'px';
    el.style.top = ((-_v.y*0.5+0.5)*window.innerHeight - size) + 'px';
  }
  place(labelEls['sun'], sunMesh, 14);
  PLANETS.forEach(p => place(labelEls[p.key], p._mesh, 10));
}

/* ---------------------------------------------------------------------
   RAYCAST SELECTION
--------------------------------------------------------------------- */
const raycaster = new THREE.Raycaster();
const pointerNDC = new THREE.Vector2();
let pointerDownPos = null;

renderer.domElement.addEventListener('pointerdown', (e) => {
  pointerDownPos = { x: e.clientX, y: e.clientY };
});
renderer.domElement.addEventListener('pointerup', (e) => {
  if(!pointerDownPos) return;
  const dx = e.clientX - pointerDownPos.x, dy = e.clientY - pointerDownPos.y;
  pointerDownPos = null;
  if(Math.hypot(dx,dy) > 8) return; // treat as drag, not tap
  pointerNDC.x = (e.clientX / window.innerWidth) * 2 - 1;
  pointerNDC.y = -(e.clientY / window.innerHeight) * 2 + 1;
  raycaster.setFromCamera(pointerNDC, camera);
  const hits = raycaster.intersectObjects([sunMesh, ...planetMeshes], false);
  if(hits.length){
    const obj = hits[0].object;
    if(obj === sunMesh) selectSun();
    else {
      const idx = planetMeshes.indexOf(obj);
      if(idx >= 0) selectPlanet(idx);
    }
  }
});

/* ---------------------------------------------------------------------
   CAMERA FOCUS / TWEEN LOGIC
--------------------------------------------------------------------- */
let followIndex = null; // null => sun
const prevTargetPos = new THREE.Vector3(0,0,0);
let tweening = false, tStart=0, tDur=1.2;
const tweenFrom = new THREE.Vector3(), tweenTo = new THREE.Vector3();
const clock = new THREE.Clock();

function easeInOut(t){ return t<0.5 ? 2*t*t : 1-Math.pow(-2*t+2,2)/2; }

function tweenCameraTo(pos, duration){
  tweenFrom.copy(camera.position);
  tweenTo.copy(pos);
  tStart = clock.getElapsedTime();
  tDur = duration || 1.2;
  tweening = true;
}

function currentTargetWorldPos(){
  if(followIndex === null) return new THREE.Vector3(0,0,0);
  return planetHolders[followIndex].getWorldPosition(new THREE.Vector3());
}

function focusOn(index, radius, colorHex){
  followIndex = index;
  const worldPos = currentTargetWorldPos();
  // Bias the approach toward the sun-facing hemisphere so the planet
  // reads as lit/detailed rather than showing its night side.
  let dir = worldPos.clone().normalize().negate();
  if(dir.lengthSq() < 0.001) dir.set(0.6,0.35,0.7);
  dir.y += 0.32;
  dir.normalize();
  const dist = Math.max(radius*7.5, 8) + 4;
  tweenCameraTo(worldPos.clone().add(dir.multiplyScalar(dist)), 1.3);
}

function selectSun(){
  followIndex = null;
  tweenCameraTo(new THREE.Vector3(0, 40, 90), 1.3);
  showInfo('Sun', 'Star', SUN_FACTS, SUN_BLURB);
  setActivePill('sun');
}

function selectPlanet(idx){
  const data = PLANETS[idx];
  focusOn(idx, data.radius);
  showInfo(data.name, 'Planet', data.facts, data.blurb);
  setActivePill(data.key);
}

function resetView(){
  followIndex = null;
  tweenCameraTo(DEFAULT_CAM_POS, 1.4);
  hideInfo();
  setActivePill(null);
}

/* ---------------------------------------------------------------------
   INFO PANEL
--------------------------------------------------------------------- */
const infoPanel = document.getElementById('infoPanel');
const infoName = document.getElementById('infoName');
const infoTag = document.getElementById('infoTag');
const infoFacts = document.getElementById('infoFacts');
const infoBlurb = document.getElementById('infoBlurb');

function showInfo(name, tag, facts, blurb){
  infoName.textContent = name;
  infoTag.textContent = tag;
  infoFacts.innerHTML = '';
  Object.entries(facts).forEach(([k,v]) => {
    const row = document.createElement('div');
    row.className = 'fact';
    row.innerHTML = `<span>${k}</span><span>${v}</span>`;
    infoFacts.appendChild(row);
  });
  infoBlurb.textContent = blurb;
  infoPanel.classList.add('open');
}
function hideInfo(){ infoPanel.classList.remove('open'); }
document.getElementById('infoClose').addEventListener('click', resetView);

/* ---------------------------------------------------------------------
   PLANET QUICK-SELECT BAR
--------------------------------------------------------------------- */
const planetBar = document.getElementById('planetBar');
function addPill(key, label, colorHex, onClick){
  const btn = document.createElement('button');
  btn.className = 'pbtn';
  btn.dataset.key = key;
  btn.innerHTML = `<span class="dot" style="background:#${colorHex.toString(16).padStart(6,'0')}; color:#${colorHex.toString(16).padStart(6,'0')}"></span><span>${label}</span>`;
  btn.addEventListener('click', onClick);
  planetBar.appendChild(btn);
}
addPill('sun', 'Sun', 0xffcc55, selectSun);
PLANETS.forEach((p, i) => addPill(p.key, p.name, p.color, () => selectPlanet(i)));
function setActivePill(key){
  [...planetBar.children].forEach(el => el.classList.toggle('active', el.dataset.key === key));
}

/* ---------------------------------------------------------------------
   TOOLBAR: play/pause, speed, labels, gyro, reset
--------------------------------------------------------------------- */
let paused = false;
let daysPerSecond = 8;

document.getElementById('btnPlay').addEventListener('click', (e) => {
  paused = !paused;
  e.target.textContent = paused ? '▶' : '⏸';
});
document.getElementById('speed').addEventListener('input', (e) => {
  daysPerSecond = Number(e.target.value);
});
document.getElementById('btnLabels').addEventListener('click', (e) => {
  labelsOn = !labelsOn;
  e.target.classList.toggle('on', labelsOn);
  if(!labelsOn) Object.values(labelEls).forEach(el => el.style.display = 'none');
});
document.getElementById('btnReset').addEventListener('click', resetView);

const gyroModal = document.getElementById('gyroModal');
const btnGyro = document.getElementById('btnGyro');
btnGyro.addEventListener('click', () => {
  if(gyroActive){ disableGyro(); return; }
  gyroModal.style.display = 'flex';
});
document.getElementById('gyroCancel').addEventListener('click', () => gyroModal.style.display = 'none');
document.getElementById('gyroAllow').addEventListener('click', async () => {
  gyroModal.style.display = 'none';
  try {
    if(typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function'){
      const res = await DeviceOrientationEvent.requestPermission();
      if(res !== 'granted') return;
    }
    enableGyro();
  } catch(err){ /* device orientation unsupported / denied */ }
});
function enableGyro(){
  deviceControls = new THREE.DeviceOrientationControls(camera);
  orbitControls.enabled = false;
  gyroActive = true;
  btnGyro.classList.add('on');
}
function disableGyro(){
  if(deviceControls){ deviceControls.disconnect(); deviceControls = null; }
  orbitControls.enabled = true;
  gyroActive = false;
  btnGyro.classList.remove('on');
}

/* ---------------------------------------------------------------------
   ANIMATION LOOP
--------------------------------------------------------------------- */
function animate(){
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);

  if(!paused){
    const days = daysPerSecond * dt;
    sunMesh.rotation.y += (Math.PI*2/25) * dt * 0.3;

    PLANETS.forEach(p => {
      p._pivot.rotation.y += (Math.PI*2 / p.orbitalPeriod) * days;
      p._mesh.rotation.y += (Math.PI*2 / p.rotationPeriod) * days;
      if(p.moons) p.moons.forEach(m => { m._pivot.rotation.y += (Math.PI*2 / m.orbitalPeriod) * days; });
    });
  }

  if(tweening){
    let t = (clock.getElapsedTime() - tStart) / tDur;
    if(t >= 1){ t = 1; tweening = false; }
    camera.position.lerpVectors(tweenFrom, tweenTo, easeInOut(t));
  } else {
    const targetPos = currentTargetWorldPos();
    const delta = targetPos.clone().sub(prevTargetPos);
    if(followIndex !== null) camera.position.add(delta);
  }

  const targetPos = currentTargetWorldPos();
  orbitControls.target.copy(targetPos);
  prevTargetPos.copy(targetPos);

  if(gyroActive && deviceControls){
    deviceControls.update();
  } else {
    orbitControls.update();
  }

  updateLabels();
  renderer.render(scene, camera);
}

/* ---------------------------------------------------------------------
   BOOT
--------------------------------------------------------------------- */
window.addEventListener('load', () => {
  const loading = document.getElementById('loading');
  loading.style.opacity = '0';
  setTimeout(() => loading.style.display = 'none', 650);
});
setTimeout(() => {
  const hint = document.getElementById('hint');
  if(hint) hint.style.opacity = '0';
}, 6000);

animate();

})();
</script>
